name: build
run-name: Build and packaging for blueheeler project
on: [push]
jobs:
  check-bats-version:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt install python3-gi python3-gi-cairo gir1.2-gtk-4.0apt libgirepository-2.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-4.0
      - run: pip3 install pycairo PyGObject poetry
      - run: poetry run task build
