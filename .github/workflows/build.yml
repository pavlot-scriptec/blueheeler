name: build
run-name: Build and packaging for blueheeler project
on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update APT
        run: sudo apt-get update
      - name: Install APT packages
        run: sudo apt install -y \
          python3-gi \
          python3-gi-cairo \
          gir1.2-gtk-4.0 \
          libgirepository-2.0-dev \
          gcc \
          libcairo2-dev \
          pkg-config \
          python3-dev \
          gir1.2-gtk-4.0 \
          xvfb \
          libgtk-4-1 \
          libgtk-4-dev \
          libglib2.0-dev \
          libadwaita-1-dev \
          dbus-x11
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3          
      - name: Install PIP dependencies
        run: pip3 install pycairo poetry
      - name: Install poetry dependencies
        run: poetry install
      - name: Run tests
        run: poetry run pytest ./tests/unit
      - name: Run build
        run: poetry run task build
      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nightly-${{ github.run_number }}"
          gh release create "$TAG" dist/* \
            --title "Nightly build $TAG" \
            --notes "Automated build from main @ ${{ github.sha }}"
